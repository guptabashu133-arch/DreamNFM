# DreamScreens - map touchscreens, holograms and NPCs (Spigot, Paper, Purpur, Folia)

# Manage your license at https://dreamscube.fun
# Downloaded from BuiltByBit? The key fills itself in on first start.
license-key: ""

prefix: "&#7AA2FF&lScreens &8» &7"

performance:
  # How often (ticks) each player's nearby holograms/NPCs/screens are checked.
  # Lower = things appear a little sooner, higher = less work. 2-10.
  tracker-ticks: 5

screens:
  # How often (ticks) the cursor/hover is updated while a player stands near a screen.
  # 1 = every tick (smoothest). Only players right in front of a screen are checked this often.
  cursor-ticks: 1
  # Smooth colour gradients in images (Floyd-Steinberg). false = flat colours.
  dither: true
  # Online/TPS graph: one sample every N seconds (60 samples are kept).
  graph-interval-seconds: 30
