# SERVER STATS - TPS / MSPT / ping / players
# Colours turn yellow/red when the server struggles. On Folia the numbers are for the region you stand in.
# Made for a 3x2 screen:  /screen create <name> 3 2 stats
#   or put it on an existing screen:  /screen design <screen> stats
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
    refresh: 20
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#34D399"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lSERVER"
        scale: 2
        color: "#34D399"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7Live  &8|  &7{time}"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      - type: "rect"
        x: 8
        y: 52
        w: 86
        h: 46
        color: "#171B24"
        border: 1
        border-color: "#2A3140"
      - type: "text"
        x: 51
        y: 59
        text: "TPS"
        max-width: 78
        color: "#9CA3AF"
        align: "center"
        shadow: false
      - type: "text"
        x: 51
        y: 72
        text: "{tps}"
        max-width: 78
        scale: 2
        color: "<status:{tps};19+=#34D399;15-18.99=#FBBF24;default=#F43F5E>"
        align: "center"
        shadow-color: "#05060A"
      - type: "rect"
        x: 102
        y: 52
        w: 86
        h: 46
        color: "#171B24"
        border: 1
        border-color: "#2A3140"
      - type: "text"
        x: 145
        y: 59
        text: "MSPT"
        max-width: 78
        color: "#9CA3AF"
        align: "center"
        shadow: false
      - type: "text"
        x: 145
        y: 72
        text: "{mspt}"
        max-width: 78
        scale: 2
        color: "<status:{mspt};0-40=#34D399;40-50=#FBBF24;default=#F43F5E>"
        align: "center"
        shadow-color: "#05060A"
      - type: "rect"
        x: 196
        y: 52
        w: 86
        h: 46
        color: "#171B24"
        border: 1
        border-color: "#2A3140"
      - type: "text"
        x: 239
        y: 59
        text: "YOUR PING"
        max-width: 78
        color: "#9CA3AF"
        align: "center"
        shadow: false
      - type: "text"
        x: 239
        y: 72
        text: "{ping}"
        max-width: 78
        scale: 2
        color: "<status:{ping};0-80=#34D399;81-180=#FBBF24;default=#F43F5E>"
        align: "center"
        shadow-color: "#05060A"
      - type: "rect"
        x: 290
        y: 52
        w: 86
        h: 46
        color: "#171B24"
        border: 1
        border-color: "#2A3140"
      - type: "text"
        x: 333
        y: 59
        text: "ONLINE"
        max-width: 78
        color: "#9CA3AF"
        align: "center"
        shadow: false
      - type: "text"
        x: 333
        y: 72
        text: "{online}"
        max-width: 78
        scale: 2
        color: "#60A5FA"
        align: "center"
        shadow-color: "#05060A"
      - type: "graph"
        source: "tps"
        x: 8
        y: 106
        w: 180
        h: 74
        color: "#34D399"
        background: "#171B24"
      - type: "graph"
        source: "mspt"
        x: 196
        y: 106
        w: 180
        h: 74
        color: "#FBBF24"
        background: "#171B24"
      - type: "rect"
        x: 8
        y: 188
        w: 368
        h: 20
        color: "#171B24"
      - type: "text"
        x: 16
        y: 194
        text: "&7Players"
        shadow: false
      - type: "progress"
        x: 64
        y: 194
        w: 250
        h: 8
        value: "{online}"
        max: "{max}"
        color: "#60A5FA"
        background: "#0B0D12"
      - type: "text"
        x: -16
        y: 194
        text: "&f{online}&7/&f{max}"
        align: "right"
        shadow: false
      - type: "rect"
        x: 8
        y: -8
        w: 368
        h: 16
        color: "#11131A"
      - type: "text"
        x: "center"
        y: -12
        text: "&7Uptime &f{uptime}  &8|  &7Graphs: last 30 min"
        color: "#9CA3AF"
