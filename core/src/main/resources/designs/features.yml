# FEATURES - browse everything the server has
# Hub with 9 categories, each opening its own page of buttons.
# Made for a 3x2 screen:  /screen create <name> 3 2 features
#   or put it on an existing screen:  /screen design <screen> features
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
# Some lines use PlaceholderAPI placeholders (%...%) - without PlaceholderAPI they show as raw text.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
