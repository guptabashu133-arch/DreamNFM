# STORE - Dreamcore /store and /mediarank
# Change the footer to your store link.
# Made for a 3x2 screen:  /screen create <name> 3 2 store
#   or put it on an existing screen:  /screen design <screen> store
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
    refresh: 20
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#F27FA5"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lSTORE"
        scale: 2
        color: "#F27FA5"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7Support the server"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      - type: "button"
        x: 8
        y: 54
        w: 368
        h: 40
        text: "&lVISIT OUR STORE"
        color: "#AA5974"
        scale: 2
        hover-color: "#D06D8E"
        shadow-color: "#3D0820"
