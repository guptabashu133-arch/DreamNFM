# BOUNTIES - DreamBounty
# List, place and learn bounties.
# Made for a 3x2 screen:  /screen create <name> 3 2 bounty
#   or put it on an existing screen:  /screen design <screen> bounty
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
    refresh: 20
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#EF4444"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lBOUNTIES"
        scale: 2
        color: "#EF4444"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7Hunt or be hunted"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      - type: "rect"
        x: 8
        y: 52
        w: 368
        h: 56
        color: "#171B24"
        border: 1
        border-color: "#EF4444"
      - type: "text"
        x: "center"
        y: 60
        text: "&lWANTED"
        scale: 3
        color: "#FFFFFF"
        shadow-color: "#450A0A"
      - type: "text"
        x: "center"
        y: 91
        text: "&7Put a price on someone's head"
        shadow: false
      - type: "rect"
        x: 8
        y: 116
        w: 117
        h: 44
        color: "#171B24"
        hover-color: "#232A37"
        border: 1
        border-color: "#EF4444"
        actions:
          - "player:bounty list"
      - type: "text"
        x: 17
        y: 128
        text: "&lVIEW"
        max-width: 103
        color: "#EF4444"
        shadow-color: "#05060A"
      - type: "text"
        x: 17
        y: 139
        text: "&7Open bounties"
        max-width: 103
        color: "#9CA3AF"
        shadow: false
      - type: "rect"
        x: 133
        y: 116
        w: 117
        h: 44
        color: "#171B24"
        hover-color: "#232A37"
        border: 1
        border-color: "#EF4444"
        actions:
          - "message:&cBounty &8> &fType &e/bounty add <player> <amount>"
      - type: "text"
        x: 142
        y: 128
        text: "&lPLACE"
        max-width: 103
        color: "#EF4444"
        shadow-color: "#05060A"
      - type: "text"
        x: 142
        y: 139
        text: "&7/bounty add"
        max-width: 103
        color: "#9CA3AF"
        shadow: false
      - type: "rect"
        x: 258
        y: 116
        w: 117
        h: 44
        color: "#171B24"
        hover-color: "#232A37"
        border: 1
        border-color: "#EF4444"
        actions:
          - "player:bounty help"
      - type: "text"
        x: 267
        y: 128
        text: "&lHELP"
        max-width: 103
        color: "#EF4444"
        shadow-color: "#05060A"
      - type: "text"
        x: 267
        y: 139
        text: "&7How it works"
        max-width: 103
        color: "#9CA3AF"
        shadow: false
      - type: "rect"
        x: 8
        y: -8
        w: 368
        h: 16
        color: "#11131A"
      - type: "text"
        x: "center"
        y: -12
        text: "&7Kill the target to claim the reward"
        color: "#9CA3AF"
