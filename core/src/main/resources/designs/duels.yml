# DUELS - 1v1 / 2v2 / ranked
# Commands are examples: set them to your duels plugin (player:<command>).
# Made for a 3x2 screen:  /screen create <name> 3 2 duels
#   or put it on an existing screen:  /screen design <screen> duels
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
    refresh: 20
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#F43F5E"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lDUELS"
        scale: 2
        color: "#F43F5E"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7Ready, {player}?"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      # BIG 1v1 CARD - change the text and the command (player:...) to your duels plugin
      - type: "rect"
        x: 8
        y: 52
        w: 368
        h: 58
        color: "#171B24"
        hover-color: "#232A37"
        border: 1
        border-color: "#F43F5E"
        actions:
          - "player:duel"
      - type: "text"
        x: "center"
        y: 60
