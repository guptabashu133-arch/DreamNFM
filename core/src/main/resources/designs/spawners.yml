# SPAWNERS - Dreamspawner
# Uses %dreamspawner_...% (PlaceholderAPI).
# Made for a 3x2 screen:  /screen create <name> 3 2 spawners
#   or put it on an existing screen:  /screen design <screen> spawners
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
    refresh: 20
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#F27FA5"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lSPAWNERS"
        scale: 2
        color: "#F27FA5"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7You own &f%dreamspawner_total_spawners%"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      - type: "rect"
        x: 8
        y: 52
        w: 117
        h: 46
        color: "#171B24"
        border: 1
        border-color: "#2A3140"
      - type: "text"
        x: 66
        y: 59
        text: "YOUR SPAWNERS"
        max-width: 109
        color: "#9CA3AF"
        align: "center"
        shadow: false
      - type: "text"
        x: 66
        y: 72
        text: "%dreamspawner_total_spawners%"
        max-width: 109
        scale: 2
        color: "#F27FA5"
        align: "center"
        shadow-color: "#05060A"
      - type: "rect"
        x: 133
        y: 52
        w: 117
        h: 46
        color: "#171B24"
        border: 1
        border-color: "#2A3140"
      - type: "text"
        x: 191
        y: 59
        text: "BALANCE"
        max-width: 109
        color: "#9CA3AF"
        align: "center"
        shadow: false
      - type: "text"
        x: 191
        y: 72
        text: "%dreamspawner_balance%"
        max-width: 109
        scale: 2
        color: "#34D399"
        align: "center"
        shadow-color: "#05060A"
      - type: "rect"
        x: 258
        y: 52
        w: 117
        h: 46
        color: "#171B24"
        border: 1
        border-color: "#2A3140"
      - type: "text"
        x: 316
        y: 59
        text: "ON SERVER"
        max-width: 109
        color: "#9CA3AF"
        align: "center"
        shadow: false
      - type: "text"
        x: 316
        y: 72
        text: "%dreamspawner_total_all_spawners%"
        max-width: 109
        scale: 2
        color: "#60A5FA"
        align: "center"
        shadow-color: "#05060A"
      - type: "rect"
        x: 8
        y: 106
        w: 368
        h: 66
        color: "#171B24"
        border: 1
        border-color: "#F27FA5"
      - type: "text"
        x: 18
        y: 112
        text: "&lTOP SPAWNER OWNERS"
        color: "#F27FA5"
        shadow-color: "#05060A"
      - type: "lines"
        x: 18
        y: 126
        align: "left"
        spacing: 1
        lines:
          - "&e1. &f%dreamspawner_top_1_name% &8- &7%dreamspawner_top_1_count%"
          - "&e2. &f%dreamspawner_top_2_name% &8- &7%dreamspawner_top_2_count%"
          - "&e3. &f%dreamspawner_top_3_name% &8- &7%dreamspawner_top_3_count%"
      - type: "button"
        x: 8
        y: 180
        w: 368
        h: 22
        text: "&lSPAWNER TOP"
        color: "#AA5974"
        hover-color: "#D06D8E"
        actions:
          - "player:spawnertop"
      - type: "rect"
        x: 8
        y: -8
        w: 368
        h: 16
        color: "#11131A"
      - type: "text"
        x: "center"
        y: -12
        text: "&7Dreamspawner  &8|  &7/spawnertop"
        color: "#9CA3AF"
