# VAULTS - Dreamvault
# Player vaults.
# Made for a 3x2 screen:  /screen create <name> 3 2 vaults
#   or put it on an existing screen:  /screen design <screen> vaults
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
    refresh: 20
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#60A5FA"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lVAULTS"
        scale: 2
        color: "#60A5FA"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7Extra storage"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      - type: "button"
        x: 8
        y: 54
        w: 368
        h: 40
        text: "&lOPEN MY VAULTS"
        color: "#1D4ED8"
        scale: 2
        hover-color: "#2563EB"
        shadow-color: "#0B1B4B"
        actions:
          - "player:pv"
      - type: "rect"
        x: 8
        y: 104
        w: 117
        h: 44
        color: "#171B24"
        hover-color: "#232A37"
        border: 1
        border-color: "#60A5FA"
