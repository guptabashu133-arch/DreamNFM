# LAND & TEAMS - Dreamlandclaim + Dreamteams
# Claims, trust and teams.
# Made for a 3x2 screen:  /screen create <name> 3 2 land
#   or put it on an existing screen:  /screen design <screen> land
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
    refresh: 20
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#84CC16"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lLAND & TEAMS"
        scale: 2
        color: "#84CC16"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7Protect what's yours"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      - type: "rect"
        x: 8
        y: 52
        w: 117
        h: 44
        color: "#171B24"
        hover-color: "#232A37"
        border: 1
        border-color: "#84CC16"
