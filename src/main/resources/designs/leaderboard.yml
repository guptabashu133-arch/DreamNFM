# LEADERBOARD - Dreamleaderboard top 10
# Live from Dreamleaderboard: {lb_<type>_<rank>_name} / {lb_<type>_<rank>_value}, types money playtime mobs deaths placed broken.
# Made for a 3x2 screen:  /screen create <name> 3 2 leaderboard
#   or put it on an existing screen:  /screen design <screen> leaderboard
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
# Money 'You:' uses %vault_eco_balance_formatted% (PlaceholderAPI Vault expansion).
start: money
click-sound: ui.button.click
pages:
  money:
    background: "none"
    refresh: 100
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#FBBF24"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lLEADERBOARD"
        scale: 2
        color: "#FBBF24"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7Richest players"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      - type: "button"
        x: 8
        y: 50
        w: 70
        h: 16
        text: "&lMONEY"
        color: "#FBBF24"
        text-color: "#1A1205"
        actions:
      - type: "button"
        x: 82
        y: 50
        w: 70
        h: 16
        text: "TIME"
        color: "#171B24"
        hover-color: "#232A37"
        text-color: "#D1D5DB"
        actions:
          - "page:playtime"
      - type: "button"
        x: 156
        y: 50
        w: 70
        h: 16
        text: "KILLS"
        color: "#171B24"
        hover-color: "#232A37"
        text-color: "#D1D5DB"
        actions:
          - "page:mobs"
      - type: "button"
        x: 230
        y: 50
        w: 70
        h: 16
        text: "DEATHS"
        color: "#171B24"
        hover-color: "#232A37"
        text-color: "#D1D5DB"
        actions:
          - "page:deaths"
      - type: "button"
        x: 304
        y: 50
        w: 70
        h: 16
        text: "MINED"
        color: "#171B24"
        hover-color: "#232A37"
        text-color: "#D1D5DB"
        actions:
          - "page:broken"
      - type: "rect"
        x: 8
        y: 80
        w: 117
        h: 88
        color: "#171B24"
        border: 1
        border-color: "#C0C7D2"
      - type: "text"
        x: 16
        y: 86
