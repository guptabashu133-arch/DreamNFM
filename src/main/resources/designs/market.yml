# MARKET - Dreamshopsells, Dreamorders, Dreamauction, Dreamcoinshop
# Coins/orbs need PlaceholderAPI.
# Made for a 3x2 screen:  /screen create <name> 3 2 market
#   or put it on an existing screen:  /screen design <screen> market
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
    refresh: 20
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#10B981"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lMARKET"
        scale: 2
        color: "#10B981"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7Buy, sell & trade"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      - type: "button"
        x: 8
        y: 52
        w: 180
        h: 34
        text: "&lSHOP"
        color: "#047857"
        scale: 2
        hover-color: "#059669"
        shadow-color: "#022C22"
