        w: 117
        h: 44
        color: "#171B24"
        hover-color: "#232A37"
        border: 1
        border-color: "#F97316"
        actions:
          - "player:koth"
      - type: "text"
        x: 142
        y: 142
        text: "&lREWARDS"
        max-width: 103
        color: "#F97316"
        shadow-color: "#05060A"
      - type: "text"
        x: 142
        y: 153
        text: "&f%koth_next_rewards%"
        max-width: 103
