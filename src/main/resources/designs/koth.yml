# KOTH - Dreamkoth
# Uses %koth_...% placeholders (PlaceholderAPI).
# Made for a 3x2 screen:  /screen create <name> 3 2 koth
#   or put it on an existing screen:  /screen design <screen> koth
# Background is transparent (shows the wall) - change 'background: none' to a colour like "#11131A".
# Edit text/colours/actions below, then /screen reload <screen>.
start: home
click-sound: ui.button.click
pages:
  home:
    background: "none"
    refresh: 20
    elements:
      - type: "rect"
        x: 8
        y: 8
        w: 368
        h: 36
        color: "#11131A"
      - type: "rect"
        x: 8
        y: 8
        w: 3
        h: 36
        color: "#F97316"
        round: false
      - type: "text"
        x: 20
        y: 14
        text: "&lKOTH"
        scale: 2
        color: "#F97316"
        shadow-color: "#05060A"
      - type: "text"
        x: -18
        y: 22
        text: "&7King of the Hill"
        max-width: 180
        color: "#9CA3AF"
        align: "right"
      - type: "rect"
        x: 8
        y: 52
        w: 368
        h: 70
        color: "#171B24"
        border: 1
        border-color: "#F97316"
      - type: "text"
        x: "center"
        y: 60
        text: "&7Next: &f&l%koth_next%"
        max-width: 356
      - type: "text"
        x: "center"
        y: 74
        text: "%koth_next_countdown%"
        max-width: 356
        scale: 3
        color: "#FFFFFF"
        shadow-color: "#431407"
      - type: "text"
        x: "center"
        y: 104
        text: "%koth_status%"
        max-width: 356
        shadow: false
      - type: "rect"
        x: 8
        y: 130
        w: 117
        h: 44
        color: "#171B24"
        hover-color: "#232A37"
        border: 1
        border-color: "#F97316"
        actions:
          - "player:koth"
      - type: "text"
        x: 17
        y: 142
        text: "&lSTARTS AT"
        max-width: 103
        color: "#F97316"
        shadow-color: "#05060A"
      - type: "text"
        x: 17
        y: 153
        text: "&f%koth_next_time%"
        max-width: 103
        color: "#9CA3AF"
        shadow: false
      - type: "rect"
        x: 133
