name: DreamNFM
version: '${project.version}'
main: org.mydreamduels.dreamnfm.DreamNFM
api-version: '1.21'
author: javacoder99
description: Holograms, Mannequin NPCs and map touchscreens - Paper and Folia.
folia-supported: true
softdepend: [PlaceholderAPI]

commands:
  dreamnfm:
    description: DreamNFM overview, reload and version
    aliases: [nfm]
  holo:
    description: Create and edit holograms
    aliases: [hologram, holograms, dh]
  npc:
    description: Create and edit NPCs
    aliases: [npcs, dnpc]
  screen:
    description: Create and manage map touchscreens
    aliases: [screens, touchscreen]

permissions:
  dreamnfm.admin:
    description: Everything in DreamNFM
    default: op
    children:
      dreamnfm.hologram: true
      dreamnfm.npc: true
      dreamnfm.screen: true
  dreamnfm.hologram:
    description: /holo
    default: op
  dreamnfm.npc:
    description: /npc
    default: op
  dreamnfm.screen:
    description: /screen
    default: op
